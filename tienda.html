<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Tienda</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f6f8; margin: 0; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 10px; }
    input, button { width: 100%; padding: 10px; margin-top: 5px; border-radius: 5px; border: 1px solid #ccc; }
    button { background: #007bff; color: white; border: none; font-weight: bold; cursor: pointer; }
    .card-solicitud { border: 1px solid #ddd; padding: 15px; border-radius: 8px; margin-bottom: 15px; background: #fafafa; }
    .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; display: inline-block; }
    .badge-exito { background: #d4edda; color: #155724; }
    .badge-espera { background: #fff3cd; color: #856404; }
  </style>
</head>
<body>

  <div class="container">
    <!-- LOGIN -->
    <div id="sec-login">
      <h2>Incluso Sesión Tienda</h2>
      <form id="form-login">
        <label>Correo:</label><input type="email" id="email" required>
        <label>Clave:</label><input type="password" id="pass" required>
        <button type="submit">Ingresar</button>
      </form>
    </div>

    <!-- PANEL TIENDA -->
    <div id="sec-panel" style="display:none;">
      <h2 id="tienda-header">Panel de Solicitudes</h2>
      <div id="lista-solicitudes">Cargando...</div>
    </div>

    <!-- CHAT TIENDA -->
    <div id="sec-chat" style="display:none;">
      <button onclick="volverPanel()" style="width:auto; background:#6c757d;">← Volver</button>
      <h3>Chat con Cliente</h3>
      <div id="chat-box" style="height:200px; overflow-y:auto; border:1px solid #ccc; padding:10px; margin-bottom:10px;"></div>
      <div style="display:flex; gap:5px;">
        <input type="text" id="chat-input-tienda" placeholder="Escribe mensaje...">
        <button onclick="enviarMensajeTienda()" style="width:100px;">Enviar</button>
      </div>
    </div>
  </div>

  <script>
    const API = 'https://repuestoexpress.onrender.com/api';
    let tiendaActual = null;
    let cotizacionSeleccionada = null;

    document.getElementById('form-login').addEventListener('submit', async (e) => {
      e.preventDefault();
      const res = await fetch(`${API}/tiendas/login`, {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('pass').value })
      });
      const data = await res.json();
      if (res.ok) {
        tiendaActual = data.tienda;
        document.getElementById('sec-login').style.display = 'none';
        document.getElementById('sec-panel').style.display = 'block';
        document.getElementById('tienda-header').innerText = `Panel: ${tiendaActual.nombre}`;
        cargarSolicitudes();
      } else { alert(data.error); }
    });

    async function cargarSolicitudes() {
      const res = await fetch(`${API}/solicitudes/tienda?tiendaId=${tiendaActual.id}`);
      const solicitudes = await res.json();
      const cont = document.getElementById('lista-solicitudes');
      cont.innerHTML = '';

      solicitudes.forEach(s => {
        const cot = s.miCotizacion;
        const div = document.createElement('div');
        div.className = 'card-solicitud';
        div.innerHTML = `
          <strong>${s.marca} ${s.modelo} (${s.anio})</strong><br>
          <span>Pieza: ${s.repuesto}</span><br>
          <small><strong>WhatsApp Cliente:</strong> ${s.cliente_whatsapp}</small><br><br>
          
          ${cot ? `
            <span class="badge ${cot.estado === 'Finalizada' ? 'badge-exito' : 'badge-espera'}">               Cotizado: $${cot.precio} | Estado: ${cot.estado}${cot.metodoEntrega ? `(${cot.metodoEntrega})` : ''}
            </span><br><br>
            ${cot.estado === 'Aceptada' || cot.estado === 'Finalizada' ? `
              <button onclick="abrirChat(${cot.id})">💬 Entrar al Chat</button>
            ` : '<small>Esperando respuesta del cliente...</small>'}
          ` : `
            <div style="display:flex; gap:5px;">
              <input type="number" id="precio-${s.id}" placeholder="Precio $">
              <button onclick="enviarCotizacion(${s.id})">Enviar Cotización</button>
            </div>
          `}
        `;
        cont.appendChild(div);
      });
    }

    async function enviarCotizacion(solicitudId) {
      const precio = document.getElementById(`precio-${solicitudId}`).value;
      if (!precio) return alert('Ingresa un precio');

      await fetch(`${API}/cotizaciones`, {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ solicitudId, tiendaId: tiendaActual.id, tiendaNombre: tiendaActual.nombre, precio })
      });
      cargarSolicitudes();
    }

    function abrirChat(cotId) {
      cotizacionSeleccionada = cotId;
      document.getElementById('sec-panel').style.display = 'none';
      document.getElementById('sec-chat').style.display = 'block';
      cargarMensajesTienda();
    }

    async function cargarMensajesTienda() {
      const res = await fetch(`${API}/chat/cotizacion/${cotizacionSeleccionada}`);
      const msgs = await res.json();
      const box = document.getElementById('chat-box');
      box.innerHTML = '';
      msgs.forEach(m => {
        const div = document.createElement('div');
        div.innerText = `${m.remitente}: ${m.texto}`;
        box.appendChild(div);
      });
    }

    async function enviarMensajeTienda() {
      const input = document.getElementById('chat-input-tienda');
      if (!input.value.trim()) return;
      await fetch(`${API}/chat`, {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ cotizacionId: cotizacionSeleccionada, remitente: 'Tienda', texto: input.value.trim() })
      });
      input.value = '';
      cargarMensajesTienda();
    }

    function volverPanel() {
      document.getElementById('sec-chat').style.display = 'none';
      document.getElementById('sec-panel').style.display = 'block';
      cargarSolicitudes();
    }
  </script>
</body>
</html>
