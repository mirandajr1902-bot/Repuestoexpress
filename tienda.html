<script>
  const API_URL = 'https://repuestoexpress.onrender.com/api';
  let ultimasSolicitudesConocidas = -1;
  let audioContext = null;

  // Inicializar o reanudar el contexto de audio del navegador al tocar el botón
  function activarNotificacionesYSonido() {
    try {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!audioContext) {
        audioContext = new AudioContext();
      }
      if (audioContext.state === 'suspended') {
        audioContext.resume();
      }

      // Reproducir sonido de prueba inmediato
      probarSonidoRespuesta();

      const btn = document.getElementById('btn-permiso');
      btn.innerText = '🔔 ¡Alerta Sonora Activada Exitosamente!';
      btn.style.background = '#d4edda';
      btn.style.borderColor = '#c3e6cb';
      btn.style.color = '#155724';
    } catch (e) {
      console.log("Error al activar audio:", e);
    }

    if ("Notification" in window && Notification.permission !== "granted") {
      Notification.requestPermission();
    }
  }

  // Genera un tono de alerta fuerte directamente sin depender de archivos de audio externos
  function probarSonidoRespuesta() {
    if (!audioContext) {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      audioContext = new AudioContext();
    }
    
    // Tono 1
    const osc1 = audioContext.createOscillator();
    const gain1 = audioContext.createGain();
    osc1.type = 'sine';
    osc1.frequency.setValueAtTime(880, audioContext.currentTime); // Nota A5
    gain1.gain.setValueAtTime(0.3, audioContext.currentTime);
    osc1.connect(gain1);
    gain1.connect(audioContext.destination);
    osc1.start();
    osc1.stop(audioContext.currentTime + 0.2);

    // Tono 2 (más agudo para llamar la atención)
    setTimeout(() => {
      const osc2 = audioContext.createOscillator();
      const gain2 = audioContext.createGain();
      osc2.type = 'sine';
      osc2.frequency.setValueAtTime(1200, audioContext.currentTime);
      gain2.gain.setValueAtTime(0.3, audioContext.currentTime);
      osc2.connect(gain2);
      gain2.connect(audioContext.destination);
      osc2.start();
      osc2.stop(audioContext.currentTime + 0.3);
    }, 200);
  }

  function dispararAlerta(solicitud) {
    // Reproducir tono generado
    probarSonidoRespuesta();

    // Notificación en pantalla
    if ("Notification" in window && Notification.permission === "granted") {
      new Notification("🚨 ¡NUEVA SOLICITUD DE REPUESTO!", {
        body: `Cliente busca: ${solicitud.repuesto}\nAuto: ${solicitud.marca} ${solicitud.modelo}`,
        icon: 'logo.jpg'
      });
    }
  }

  function mostrarPestana(pestana) {
    if (pestana === 'registro') {
      document.getElementById('pestana-registro').classList.remove('hidden');
      document.getElementById('pestana-pedidos').classList.add('hidden');
    } else {
      document.getElementById('pestana-registro').classList.add('hidden');
      document.getElementById('pestana-pedidos').classList.remove('hidden');
      cargarSolicitudes();
    }
  }

  // Cargar Solicitudes
  async function cargarSolicitudes() {
    const contenedor = document.getElementById('contenedor-solicitudes');

    try {
      const res = await fetch(`${API_URL}/solicitudes`);
      const solicitudes = await res.json();

      // Si detecta una nueva solicitud
      if (ultimasSolicitudesConocidas !== -1 && solicitudes.length > ultimasSolicitudesConocidas) {
        dispararAlerta(solicitudes[0]);
      }
      
      ultimasSolicitudesConocidas = solicitudes.length;

      if (solicitudes.length === 0) {
        contenedor.innerHTML = '<p style="text-align:center;">No hay solicitudes registradas por el momento.</p>';
        return;
      }

      contenedor.innerHTML = '';
      solicitudes.forEach(s => {
        const wsLimpio = s.cliente_whatsapp ? s.cliente_whatsapp.replace(/[^0-9]/g, '') : '';
        const textoWs = encodeURIComponent(`Hola, vi tu solicitud en RepuestoExpress para el repuesto de ${s.marca} ${s.modelo} (${s.anio}). ¿Aún lo necesitas?`);

        contenedor.innerHTML += `
          <div class="solicitud-card">
            <h3>🚗 ${s.marca} ${s.modelo} (${s.anio})</h3>
            <p><strong>Repuesto:</strong> ${s.repuesto}</p>
            ${s.vin ? `<p><strong>VIN:</strong> ${s.vin}</p>` : ''}
            <p><strong>Cliente WhatsApp:</strong> ${s.cliente_whatsapp}</p>
            ${s.foto_url ? `<p><strong>Foto del repuesto:</strong></p><img src="${s.foto_url}" class="foto-adjunta" alt="Foto repuesto">` : ''}
            <a href="https://wa.me/${wsLimpio}?text=${textoWs}" target="_blank" class="btn-ws">💬 Contestar por WhatsApp</a>
          </div>
        `;
      });
    } catch (err) {
      contenedor.innerHTML = '<p style="color:red; text-align:center;">Error conectando con el servidor.</p>';
    }
  }

  // Revisar nuevas solicitudes automáticamente cada 7 segundos
  setInterval(cargarSolicitudes, 7000);
        </script>
