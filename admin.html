<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RepuestoExpress - Panel Administrador</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f4f6f8; color: #333; }
    .container { max-width: 950px; margin: 0 auto; }
    .card { background: #fff; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 20px; }
    h2, h3 { margin-top: 0; color: #007bff; }
    label { display: block; margin-top: 10px; font-weight: bold; font-size: 14px; }
    input, button { width: 100%; padding: 12px; margin-top: 5px; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; font-size: 15px; }
    button { background: #007bff; color: white; border: none; font-weight: bold; cursor: pointer; }
    button:hover { background: #0056b3; }
    .btn-danger { background: #dc3545; }
    .btn-danger:hover { background: #bd2130; }
    .btn-success { background: #28a745; }
    .btn-success:hover { background: #218838; }
    .btn-secondary { background: #6c757d; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
    th { background-color: #f2f2f2; }
    
    .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
    .badge-activa { background: #d4edda; color: #155724; }
    .badge-inactiva { background: #f8d7da; color: #721c24; }

    #chat-box { height: 280px; overflow-y: auto; border: 1px solid #ddd; padding: 12px; border-radius: 6px; background: #fdfdfd; margin-bottom: 15px; display: flex; flex-direction: column; gap: 8px; }
    .msg { padding: 8px 14px; border-radius: 8px; max-width: 75%; font-size: 14px; word-break: break-word; }
    .msg-tienda { background: #007bff; color: white; align-self: flex-end; }
    .msg-cliente { background: #e9ecef; color: #333; align-self: flex-start; }
    .msg-meta { font-size: 10px; opacity: 0.8; display: block; margin-top: 4px; }
  </style>
</head>
<body>

  <div class="container">

    <!-- 1. LOGIN ADMIN -->
    <div id="section-login" class="card">
      <h2>🛡️ Panel Administrador</h2>
      <form id="form-login">
        <label>Usuario:</label>
        <input type="text" id="admin-user" placeholder="admin" required>

        <label>Contraseña:</label>
        <input type="password" id="admin-pass" placeholder="admin123" required>

        <button type="submit">Ingresar como Administrador</button>
      </form>
      <p id="login-error" style="color: red; text-align: center; margin-top: 15px; font-weight: bold;"></p>
    </div>

    <!-- 2. PANEL PRINCIPAL -->
    <div id="section-panel" class="card" style="display: none;">
      <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 10px;">
        <h2>Gestión General</h2>
        <button onclick="logout()" class="btn-danger" style="width: auto;">Cerrar Sesión</button>
      </div>

      <!-- SECCIÓN TIENDAS -->
      <h3 style="margin-top: 25px;">🏪 Control de Tiendas</h3>
      <table>
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Correo</th>
            <th>Estado</th>
            <th>Acción</th>
          </tr>
        </thead>
        <tbody id="tabla-tiendas">
          <!-- Carga dinámica -->
        </tbody>
      </table>

      <!-- SECCIÓN CONVERSACIONES / SOLICITUDES -->
      <h3 style="margin-top: 35px;">💬 Conversaciones y Solicitudes</h3>
      <div id="lista-conversaciones">Cargando conversaciones...</div>
    </div>

    <!-- 3. VISTA DE CHAT PARA AUDITORÍA -->
    <div id="section-chat" class="card" style="display: none;">
      <button onclick="cerrarChat()" class="btn-secondary" style="width: auto; margin-bottom: 15px;">← Volver al Panel</button>
      <h3 id="chat-titulo">Conversación de la Solicitud</h3>
      
      <div id="chat-box"></div>
    </div>

  </div>

  <script>
    const API_URL = 'https://repuestoexpress.onrender.com/api';
    let intervalChat = null;
    let solicitudActivaId = null;

    // Login Admin
    document.getElementById('form-login').addEventListener('submit', async (e) => {
      e.preventDefault();
      const usuario = document.getElementById('admin-user').value.trim();
      const password = document.getElementById('admin-pass').value.trim();

      try {
        const res = await fetch(`${API_URL}/admin/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ usuario, password })
        });
        const data = await res.json();

        if (res.ok) {
          document.getElementById('section-login').style.display = 'none';
          document.getElementById('section-panel').style.display = 'block';
          cargarTiendas();
          cargarConversaciones();
        } else {
          document.getElementById('login-error').innerText = data.error || 'Acceso denegado';
        }
      } catch (err) {
        document.getElementById('login-error').innerText = 'Error al conectar con el servidor';
      }
    });

    // Cargar Lista de Tiendas
    async function cargarTiendas() {
      try {
        const res = await fetch(`${API_URL}/admin/tiendas`);
        const tiendas = await res.json();
        const tbody = document.getElementById('tabla-tiendas');
        tbody.innerHTML = '';

        tiendas.forEach(t => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td><strong>${t.nombre}</strong></td>
            <td>${t.email}</td>
            <td>
              <span class="badge ${t.activa ? 'badge-activa' : 'badge-inactiva'}">
                ${t.activa ? 'Activa' : 'Desactivada'}
              </span>
            </td>
            <td>
              <button class="${t.activa ? 'btn-danger' : 'btn-success'}" style="width: auto; padding: 6px 12px; margin: 0;" onclick="toggleTienda(${t.id})">
                ${t.activa ? 'Desactivar' : 'Activar'}
              </button>
            </td>
          `;
          tbody.appendChild(tr);
        });
      } catch (err) {
        console.error('Error al cargar tiendas:', err);
      }
    }

    // Activar/Desactivar Tienda
    async function toggleTienda(id) {
      try {
        const res = await fetch(`${API_URL}/admin/tiendas/${id}/toggle`, { method: 'POST' });
        if (res.ok) {
          cargarTiendas();
        }
      } catch (err) {
        alert('Error al cambiar el estado de la tienda');
      }
    }

    // Cargar Solicitudes y Conversaciones
    async function cargarConversaciones() {
      try {
        const res = await fetch(`${API_URL}/solicitudes`);
        const solicitudes = await res.json();
        const contenedor = document.getElementById('lista-conversaciones');
        contenedor.innerHTML = '';

        if (!solicitudes || solicitudes.length === 0) {
          contenedor.innerHTML = '<p>No hay solicitudes registradas.</p>';
          return;
        }

        solicitudes.forEach(sol => {
          const div = document.createElement('div');
          div.style.cssText = 'border: 1px solid #ddd; padding: 12px; border-radius: 6px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; background: #fafafa;';
          div.innerHTML = `
            <div>
              <strong>${sol.marca} ${sol.modelo} (${sol.anio})</strong> - Repuesto: <em>${sol.repuesto}</em><br>
              <small>Tienda asignada: <strong>${sol.tiendaAsignada || 'Ninguna (Pendiente)'}</strong> | WhatsApp: ${sol.cliente_whatsapp}</small>
            </div>
            <button onclick="verChat(${sol.id}, '${sol.marca} ${sol.modelo}')" style="width: auto; padding: 8px 14px; margin: 0;">
              👁️ Ver Chat
            </button>
          `;
          contenedor.appendChild(div);
        });
      } catch (err) {
        console.error('Error al cargar conversaciones:', err);
      }
    }

    // Inspeccionar Chat
    function verChat(solicitudId, titulo) {
      solicitudActivaId = solicitudId;
      document.getElementById('section-panel').style.display = 'none';
      document.getElementById('section-chat').style.display = 'block';
      document.getElementById('chat-titulo').innerText = `Auditoría de Chat: ${titulo}`;

      cargarMensajes();
      intervalChat = setInterval(cargarMensajes, 3000);
    }

    function cerrarChat() {
      clearInterval(intervalChat);
      solicitudActivaId = null;
      document.getElementById('section-chat').style.display = 'none';
      document.getElementById('section-panel').style.display = 'block';
    }

    async function cargarMensajes() {
      if (!solicitudActivaId) return;
      try {
        const res = await fetch(`${API_URL}/chat/${solicitudActivaId}`);
        const mensajes = await res.json();
        const chatBox = document.getElementById('chat-box');
        chatBox.innerHTML = '';

        if (mensajes.length === 0) {
          chatBox.innerHTML = '<p style="text-align: center; color: #777;">No hay mensajes registrados en esta solicitud.</p>';
          return;
        }

        mensajes.forEach(m => {
          const div = document.createElement('div');
          div.className = `msg ${m.remitente === 'Tienda' ? 'msg-tienda' : 'msg-cliente'}`;
          div.innerHTML = `
            <strong>${m.remitente}:</strong> ${m.texto}
            <span class="msg-meta">${m.fecha}</span>
          `;
          chatBox.appendChild(div);
        });
        chatBox.scrollTop = chatBox.scrollHeight;
      } catch (err) {
        console.error('Error al cargar chat:', err);
      }
    }

    function logout() {
      document.getElementById('section-panel').style.display = 'none';
      document.getElementById('section-login').style.display = 'block';
      document.getElementById('admin-user').value = '';
      document.getElementById('admin-pass').value = '';
    }
  </script>

</body>
</html>
