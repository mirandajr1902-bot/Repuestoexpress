                  <small>${t.ubicacion || 'Sin ubicación'}</small>
                </div>
                <a class="btn-ws" href="${linkWs}" target="_blank">WhatsApp</a>
              </div>
            `;
          });
        }

        document.getElementById('resultados').style.display = 'block';
      } catch (err) {
        alert('Error al conectar con el servidor de Render.');
      }
    });
  </script>
</body>
</html>
