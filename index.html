<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RepuestoExpress - Solicitar Repuesto</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f4f6f8; color: #333; }
    .container { max-width: 500px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    .header-logo { text-align: center; margin-bottom: 15px; }
    .header-logo img { max-width: 160px; height: auto; border-radius: 8px; }
    h1 { color: #007bff; text-align: center; margin-top: 5px; font-size: 24px; }
    label { display: block; margin-top: 12px; font-weight: bold; font-size: 14px; }
    input, button { width: 100%; padding: 12px; margin-top: 5px; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; font-size: 15px; }
    input[type="file"] { background: #f8f9fa; padding: 8px; cursor: pointer; }
    button { background: #007bff; color: white; border: none; font-weight: bold; margin-top: 20px; cursor: pointer; }
    #preview-img { max-width: 100%; max-height: 200px; margin-top: 10px; border-radius: 6px; display: none; object-fit: cover; }
    #msg-cliente { text-align: center; font-weight: bold; margin-top: 15px; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-logo">
      <img src="logo.jpg" alt="RepuestoExpress Logo" onerror="this.onerror=null; this.src='logo.png';">
    </div>

    <h1>Solicita tu Repuesto</h1>

    <form id="form-solicitud">
      <label>Marca del Auto:</label>
      <input type="text" id="marca" placeholder="Ej: Toyota, Nissan" required>

      <label>Modelo del Auto:</label>
      <input type="text" id="modelo" placeholder="Ej: Corolla, Sentra" required>

      <label>Año:</label>
      <input type="number" id="anio" placeholder="Ej: 2018" required>

      <label>Repuesto que buscas:</label>
      <input type="text" id="repuesto" placeholder="Ej: Amortiguadores delanteros" required>

      <label>Número de Chasis / VIN (Opcional):</label>
      <input type="text" id="vin" placeholder="Para repuestos muy específicos">

      <label>📷 Foto de la pieza/repuesto (Opcional):</label>
      <input type="file" id="foto_repuesto" accept="image/*">
      <img id="preview-img" alt="Vista previa de la foto">

      <label>Tu Número de WhatsApp:</label>
      <input type="text" id="whatsapp" placeholder="Ej: +50760000000" required>

      <button type="submit">🚀 Enviar Solicitud a las Tiendas</button>
    </form>

    <p id="msg-cliente"></p>
  </div>

  <script>
    const API_URL = 'https://repuestoexpress.onrender.com/api';
    let fotoBase64Comprimida = '';

    // Función para redimensionar y comprimir fotos antes de subir
    document.getElementById('foto_repuesto').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(event) {
          const img = new Image();
          img.src = event.target.result;
          img.onload = function() {
            const canvas = document.createElement('canvas');
            const maxDimension = 800; // Redimensionar tamaño máximo a 800px
            let width = img.width;
            let height = img.height;

            if (width > height) {
              if (width > maxDimension) { height *= maxDimension / width; width = maxDimension; }
            } else {
              if (height > maxDimension) { width *= maxDimension / height; height = maxDimension; }
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            // Exportar compresión JPEG al 70% calidad
            fotoBase64Comprimida = canvas.toDataURL('image/jpeg', 0.7);

            const imgPreview = document.getElementById('preview-img');
            imgPreview.src = fotoBase64Comprimida;
            imgPreview.style.display = 'block';
          };
        };
        reader.readAsDataURL(file);
      }
    });

    document.getElementById('form-solicitud').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('msg-cliente');
      msg.style.color = '#333';
      msg.innerText = 'Enviando solicitud...';

      const data = {
        marca: document.getElementById('marca').value,
        modelo: document.getElementById('modelo').value,
        anio: parseInt(document.getElementById('anio').value),
        repuesto: document.getElementById('repuesto').value,
        vin: document.getElementById('vin').value,
        foto_url: fotoBase64Comprimida,
        cliente_whatsapp: document.getElementById('whatsapp').value
      };

      try {
        const res = await fetch(`${API_URL}/solicitudes`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

        if (res.ok) {
          msg.style.color = 'green';
          msg.innerText = '¡Solicitud enviada con éxito!';
          document.getElementById('form-solicitud').reset();
          document.getElementById('preview-img').style.display = 'none';
          fotoBase64Comprimida = '';
        } else {
          msg.style.color = 'red';
          msg.innerText = 'Error al enviar la solicitud.';
        }
      } catch (err) {
        msg.style.color = 'red';
        msg.innerText = 'Error de conexión.';
      }
    });
  </script>

</body>
</html>
