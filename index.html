<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RepuestoExpress - Solicitar Repuesto</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f4f6f8; color: #333; }
    .container { max-width: 500px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    .header-logo { text-align: center; margin-bottom: 15px; }
    .header-logo img { max-width: 160px; height: auto; border-radius: 8px; }
    .banner-container { width: 100%; margin-bottom: 20px; text-align: center; overflow: hidden; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
    .banner-container img { width: 100%; max-height: 120px; object-fit: cover; display: block; border-radius: 8px; cursor: pointer; }
    h1, h2, h3, h4 { color: #007bff; text-align: center; margin-top: 5px; }
    label { display: block; margin-top: 12px; font-weight: bold; font-size: 14px; }
    input, button, select { width: 100%; padding: 12px; margin-top: 5px; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; font-size: 15px; }
    input[type="file"] { background: #f8f9fa; padding: 8px; cursor: pointer; }
    button { background: #007bff; color: white; border: none; font-weight: bold; margin-top: 15px; cursor: pointer; }
    button:hover { background: #0056b3; }
    .btn-success { background: #28a745; margin-top: 10px; }
    .btn-secondary { background: #6c757d; margin-top: 10px; }
    #preview-img { max-width: 100%; max-height: 200px; margin-top: 10px; border-radius: 6px; display: none; object-fit: cover; }
    #msg-cliente { text-align: center; font-weight: bold; margin-top: 15px; }
    .consultar-box { border-top: 2px solid #eee; margin-top: 25px; padding-top: 15px; }
    .card-cotizacion { border: 1px solid #2196F3; background: #e7f3fe; border-radius: 8px; padding: 15px; margin-bottom: 15px; text-align: center; }
    #chat-box { height: 260px; overflow-y: auto; border: 1px solid #ddd; padding: 12px; border-radius: 6px; background: #fdfdfd; margin-bottom: 15px; display: flex; flex-direction: column; gap: 8px; }
    .msg { padding: 8px 14px; border-radius: 8px; max-width: 80%; font-size: 14px; word-break: break-word; line-height: 1.4; }
    .msg-tienda { background: #e9ecef; color: #333; align-self: flex-start; border-left: 4px solid #007bff; }
    .msg-cliente { background: #007bff; color: white; align-self: flex-end; text-align: right; }
    .msg-meta { font-size: 10px; opacity: 0.8; display: block; margin-top: 4px; }
    .info-box { background: #f8f9fa; border-left: 4px solid #28a745; padding: 12px; margin-bottom: 15px; border-radius: 4px; font-size: 13px; text-align: left; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-logo">
      <img src="logo.png" alt="RepuestoExpress Logo" onerror="this.onerror=null; this.src='logo.jpg';">
    </div>

    <div class="banner-container" id="banner-top">
      <a id="banner-top-link" href="#" target="_blank">
        <img id="banner-top-img" src="https://via.placeholder.com/500x120?text=Tu+Publicidad+AQU%C3%81" alt="Publicidad">
      </a>
    </div>

    <!-- FORMULARIO -->
    <div id="section-form">
      <h1>Solicita tu Repuesto</h1>
      <form id="form-solicitud">
        <label>Marca del Auto:</label><input type="text" id="marca" placeholder="Ej: Toyota, Nissan" required>
        <label>Modelo del Auto:</label><input type="text" id="modelo" placeholder="Ej: Corolla, Sentra" required>
        <label>Año:</label><input type="number" id="anio" placeholder="Ej: 2018" required>
        <label>Repuesto que buscas:</label><input type="text" id="repuesto" placeholder="Ej: Amortiguadores delanteros" required>
        <label>Número de Chasis / VIN (Opcional):</label><input type="text" id="vin" placeholder="Para repuestos muy específicos">
        <label>📷 Foto de la pieza/repuesto (Opcional):</label><input type="file" id="foto_repuesto" accept="image/*">
        <img id="preview-img" alt="Vista previa de la foto">
        <label>Tu Número de WhatsApp:</label><input type="text" id="whatsapp" placeholder="Ej: 50765675993" required>
        <button type="submit" id="btn-enviar">🚀 Enviar Solicitud a las Tiendas</button>
      </form>
      <p id="msg-cliente"></p>
      <div class="consultar-box">
        <label>¿Ya solicitaste? Ingresa tu WhatsApp para ver respuestas:</label>
        <input type="text" id="consultar-whatsapp" placeholder="Ej: 50765675993">
        <button onclick="buscarSolicitudPorWhatsapp()" class="btn-secondary">🔍 Ver mis cotizaciones</button>
      </div>
    </div>

    <!-- COTIZACIONES -->
    <div id="section-cotizaciones" style="display: none;">
      <h2>Cotizaciones Disponibles</h2>
      <div id="info-resumen-solicitud" class="info-box"></div>
      <div id="lista-cotizaciones"><p style="text-align: center; color: #666;">Cargando cotizaciones...</p></div>
      <button onclick="limpiarYVolver()" class="btn-secondary">← Hacer otra solicitud</button>
    </div>

    <!-- CHAT Y ENTREGA -->
    <div id="section-chat" style="display: none;">
      <h2 id="chat-tienda-titulo">Chat con la Tienda</h2>
      <div id="chat-box"></div>
      <div style="display: flex; gap: 8px;">
        <input type="text" id="chat-input" placeholder="Escribe tu mensaje..." style="margin: 0;">
        <button onclick="enviarMensajeCliente()" style="width: 110px; margin: 0;">Enviar</button>
      </div>

      <div style="margin-top: 25px; border-top: 2px dashed #ccc; padding-top: 15px;">
        <h4 style="margin-bottom: 5px;">📦 Concluir y Realizar Pedido</h4>
        <label style="margin-top: 0;">Selecciona cómo deseas recibir tu repuesto:</label>
        <select id="select-metodo">
          <option value="Retiro en Local">🏬 Retiro en Local</option>
          <option value="Delivery">🛵 Delivery</option>
        </select>
        <button onclick="finalizarPedido()" class="btn-success">✅ Confirmar Pedido</button>
      </div>
      <button onclick="volverACotizaciones()" class="btn-secondary">← Volver a Cotizaciones</button>
    </div>
  </div>

  <script>
    const API_URL = 'https://repuestoexpress.onrender.com/api';
    let fotoBase64 = null;
    let solicitudActiva = null;
    let cotizacionActiva = null;
    let intervalCot = null;
    let intervalChat = null;

    // Cargar Banners
    async function cargarBanners() {
      try {
        const res = await fetch(`${API_URL}/banners`);
        const banner = await res.json();
        if (banner && banner.imagen_url) {
          document.getElementById('banner-top-img').src = banner.imagen_url;
          document.getElementById('banner-top-link').href = banner.link_url || '#';
        }
      } catch (err) {}
    }
    cargarBanners();

    // RESTAURAR SESIÓN AL CARGAR PÁGINA
    window.addEventListener('load', () => {
      const guardada = localStorage.getItem('solicitudActiva');
      if (guardada) {
        solicitudActiva = JSON.parse(guardada);
        mostrarPantallaCotizaciones();
      }
    });

    document.getElementById('foto_repuesto').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(event) {
          const img = new Image();
          img.src = event.target.result;
          img.onload = function() {
            const canvas = document.createElement('canvas');
            const maxDimension = 600;
            let width = img.width, height = img.height;
            if (width > height) { if (width > maxDimension) { height *= maxDimension / width; width = maxDimension; } }
            else { if (height > maxDimension) { width *= maxDimension / height; height = maxDimension; } }
            canvas.width = width; canvas.height = height;
            canvas.getContext('2d').drawImage(img, 0, 0, width, height);
            fotoBase64 = canvas.toDataURL('image/jpeg', 0.5);
            document.getElementById('preview-img').src = fotoBase64;
            document.getElementById('preview-img').style.display = 'block';
          };
        };
        reader.readAsDataURL(file);
      }
    });

    document.getElementById('form-solicitud').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('msg-cliente');
      const btn = document.getElementById('btn-enviar');
      btn.disabled = true; msg.innerText = 'Enviando solicitud...';

      const data = {
        marca: document.getElementById('marca').value.trim(),
        modelo: document.getElementById('modelo').value.trim(),
        anio: parseInt(document.getElementById('anio').value),
        repuesto: document.getElementById('repuesto').value.trim(),
        vin: document.getElementById('vin').value.trim() || '',
        foto_url: fotoBase64 || null,
        cliente_whatsapp: document.getElementById('whatsapp').value.trim()
      };

      try {
        const res = await fetch(`${API_URL}/solicitudes`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data)
        });
        const resData = await res.json();
        if (res.ok && resData.solicitud) {
          msg.innerText = '';
          document.getElementById('form-solicitud').reset();
          solicitudActiva = resData.solicitud;
          localStorage.setItem('solicitudActiva', JSON.stringify(solicitudActiva));
          mostrarPantallaCotizaciones();
        }
      } catch (err) { msg.innerText = 'Error al enviar.'; }
      finally { btn.disabled = false; }
    });

    function mostrarPantallaCotizaciones() {
      document.getElementById('section-form').style.display = 'none';
      document.getElementById('section-chat').style.display = 'none';
      document.getElementById('section-cotizaciones').style.display = 'block';

      document.getElementById('info-resumen-solicitud').innerHTML = `
        <strong>Solicitud:</strong> ${solicitudActiva.marca} ${solicitudActiva.modelo} (${solicitudActiva.anio})<br>
        <strong>Pieza:</strong> ${solicitudActiva.repuesto}
      `;

      cargarCotizaciones();
      if (intervalCot) clearInterval(intervalCot);
      intervalCot = setInterval(cargarCotizaciones, 3000);
    }

    async function cargarCotizaciones() {
      if (!solicitudActiva) return;
      try {
        const res = await fetch(`${API_URL}/cotizaciones/solicitud/${solicitudActiva.id}`);
        const cots = await res.json();
        const contenedor = document.getElementById('lista-cotizaciones');
        contenedor.innerHTML = '';

        if (!cots || cots.length === 0) {
          contenedor.innerHTML = '<p style="text-align: center; color: #888;">Las tiendas están preparando sus precios...</p>';
          return;
        }

        cots.forEach(c => {
          const div = document.createElement('div');
          div.className = 'card-cotizacion';
          div.innerHTML = `
            <strong style="font-size: 16px;">${c.tiendaNombre}</strong><br>
            <span style="font-size: 20px; font-weight: bold; color: #28a745;">Precio: $${c.precio}</span><br>
            <button class="btn-success" onclick="aceptarOferta(${c.id}, '${c.tiendaNombre}')">💬 Aceptar Oferta y Chatear</button>
          `;
          contenedor.appendChild(div);
        });
      } catch (err) {}
    }

    async function aceptarOferta(cotId, tiendaNombre) {
      if (intervalCot) clearInterval(intervalCot);
      const res = await fetch(`${API_URL}/cotizaciones/${cotId}/aceptar`, { method: 'POST' });
      const data = await res.json();
      cotizacionActiva = data.cotizacion;

      document.getElementById('section-cotizaciones').style.display = 'none';
      document.getElementById('section-chat').style.display = 'block';
      document.getElementById('chat-tienda-titulo').innerText = `Chat con ${tiendaNombre}`;

      cargarMensajes();
      if (intervalChat) clearInterval(intervalChat);
      intervalChat = setInterval(cargarMensajes, 3000);
    }

    async function cargarMensajes() {
      if (!cotizacionActiva) return;
      const res = await fetch(`${API_URL}/chat/cotizacion/${cotizacionActiva.id}`);
      const msgs = await res.json();
      const box = document.getElementById('chat-box');
      box.innerHTML = '';

      msgs.forEach(m => {
        const div = document.createElement('div');
        div.className = `msg ${m.remitente === 'Cliente' ? 'msg-cliente' : 'msg-tienda'}`;
        div.innerHTML = `<strong>${m.remitente}:</strong> ${m.texto}<span class="msg-meta">${m.fecha}</span>`;
        box.appendChild(div);
      });
      box.scrollTop = box.scrollHeight;
    }

    async function enviarMensajeCliente() {
      const input = document.getElementById('chat-input');
      if (!input.value.trim() || !cotizacionActiva) return;

      await fetch(`${API_URL}/chat`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ cotizacionId: cotizacionActiva.id, remitente: 'Cliente', texto: input.value.trim() })
      });
      input.value = '';
      cargarMensajes();
    }

    async function finalizarPedido() {
      const metodo = document.getElementById('select-metodo').value;
      const res = await fetch(`${API_URL}/cotizaciones/${cotizacionActiva.id}/finalizar`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ metodoEntrega: metodo })
      });
      if (res.ok) {
        alert('🎉 ¡Pedido confirmado! La tienda se contactará a tu WhatsApp.');
        limpiarYVolver();
      }
    }

    async function buscarSolicitudPorWhatsapp() {
      const wsInput = document.getElementById('consultar-whatsapp').value.trim();
      if (!wsInput) return alert('Ingresa tu WhatsApp');

      const res = await fetch(`${API_URL}/solicitudes/cliente/${wsInput}`);
      const solicitudes = await res.json();
      if (solicitudes.length > 0) {
        solicitudActiva = solicitudes[0];
        localStorage.setItem('solicitudActiva', JSON.stringify(solicitudActiva));
        mostrarPantallaCotizaciones();
      } else { alert('No hay solicitudes con ese número.'); }
    }

    function limpiarYVolver() {
      if (intervalCot) clearInterval(intervalCot);
      if (intervalChat) clearInterval(intervalChat);
      solicitudActiva = null; cotizacionActiva = null;
      localStorage.removeItem('solicitudActiva');
      document.getElementById('section-cotizaciones').style.display = 'none';
      document.getElementById('section-chat').style.display = 'none';
      document.getElementById('section-form').style.display = 'block';
    }

    function volverACotizaciones() {
      if (intervalChat) clearInterval(intervalChat);
      cotizacionActiva = null;
      mostrarPantallaCotizaciones();
    }
  </script>
</body>
</html>
