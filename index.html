<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RepuestoExpress</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f6f8; margin: 0; padding: 20px; color: #333; }
    .container { max-width: 500px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h1, h2, h3 { color: #007bff; text-align: center; }
    label { display: block; margin-top: 10px; font-weight: bold; font-size: 14px; }
    input, button, select { width: 100%; padding: 12px; margin-top: 5px; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; font-size: 15px; }
    button { background: #007bff; color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 15px; }
    .btn-success { background: #28a745; }
    .btn-secondary { background: #6c757d; }
    .card-cotizacion { border: 1px solid #2196F3; background: #e7f3fe; border-radius: 8px; padding: 15px; margin-bottom: 12px; }
    #chat-box { height: 250px; overflow-y: auto; border: 1px solid #ddd; padding: 10px; border-radius: 6px; background: #fff; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; }
    .msg { padding: 8px 12px; border-radius: 6px; max-width: 80%; font-size: 14px; }
    .msg-tienda { background: #e9ecef; align-self: flex-start; }
    .msg-cliente { background: #007bff; color: white; align-self: flex-end; }
  </style>
</head>
<body>

  <div class="container">
    <!-- FORMULARIO -->
    <div id="sec-form">
      <h1>Solicitar Repuesto</h1>
      <form id="form-solicitud">
        <label>Marca:</label><input type="text" id="marca" required>
        <label>Modelo:</label><input type="text" id="modelo" required>
        <label>Año:</label><input type="number" id="anio" required>
        <label>Repuesto:</label><input type="text" id="repuesto" required>
        <label>WhatsApp de Contacto:</label><input type="text" id="whatsapp" required>
        <button type="submit">🚀 Enviar Solicitud</button>
      </form>
    </div>

    <!-- LISTA DE COTIZACIONES RECIBIDAS -->
    <div id="sec-cotizaciones" style="display:none;">
      <h2>Cotizaciones Recibidas</h2>
      <div id="lista-cots">Buscando ofertas de tiendas...</div>
    </div>

    <!-- CHAT CON LA TIENDA SELECCIONADA -->
    <div id="sec-chat" style="display:none;">
      <h3 id="chat-tienda-titulo">Chat con Tienda</h3>
      <div id="chat-box"></div>
      <div style="display:flex; gap:5px;">
        <input type="text" id="chat-input" placeholder="Escribe un mensaje...">
        <button onclick="enviarMensaje()" style="width:100px; margin:0;">Enviar</button>
      </div>

      <!-- BOTÓN PARA PASAR A PEDIDO -->
      <div id="bloque-finalizar" style="margin-top: 20px; border-top: 2px dashed #ccc; padding-top: 15px;">
        <h4>📦 Concluir y Realizar Pedido</h4>
        <label>Selecciona cómo deseas recibir tu repuesto:</label>
        <select id="select-metodo">
          <option value="Retiro en Local">🏬 Retiro en Local</option>
          <option value="Delivery">🛵 Delivery</option>
        </select>
        <button onclick="finalizarPedido()" class="btn-success">✅ Confirmar Pedido y Compartir WhatsApp</button>
      </div>
    </div>
  </div>

  <script>
    const API = 'https://repuestoexpress.onrender.com/api';
    let solicitudActiva = null;
    let cotizacionActiva = null;
    let intervalCot = null;
    let intervalChat = null;

    document.getElementById('form-solicitud').addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = {
        marca: document.getElementById('marca').value,
        modelo: document.getElementById('modelo').value,
        anio: document.getElementById('anio').value,
        repuesto: document.getElementById('repuesto').value,
        cliente_whatsapp: document.getElementById('whatsapp').value
      };
      const res = await fetch(`${API}/solicitudes`, {
        method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data)
      });
      const resData = await res.json();
      solicitudActiva = resData.solicitud;

      document.getElementById('sec-form').style.display = 'none';
      document.getElementById('sec-cotizaciones').style.display = 'block';

      cargarCotizaciones();
      intervalCot = setInterval(cargarCotizaciones, 3000);
    });

    async function cargarCotizaciones() {
      if (!solicitudActiva) return;
      const res = await fetch(`${API}/cotizaciones/solicitud/${solicitudActiva.id}`);
      const cots = await res.json();
      const contenedor = document.getElementById('lista-cots');
      contenedor.innerHTML = '';

      if (cots.length === 0) {
        contenedor.innerHTML = '<p style="text-align:center;">Las tiendas están preparando sus precios...</p>';
        return;
      }

      cots.forEach(c => {
        const div = document.createElement('div');
        div.className = 'card-cotizacion';
        div.innerHTML = `
          <strong>Tienda: ${c.tiendaNombre}</strong><br>
          <span style="font-size:18px; color:green;">Precio: $${c.precio}</span><br>
          <button class="btn-success" onclick="aceptarOferta(${c.id}, '${c.tiendaNombre}')">💬 Aceptar Oferta y Chatear</button>
        `;
        contenedor.appendChild(div);
      });
    }

    async function aceptarOferta(cotId, tiendaNombre) {
      clearInterval(intervalCot);
      const res = await fetch(`${API}/cotizaciones/${cotId}/aceptar`, { method: 'POST' });
      const data = await res.json();
      cotizacionActiva = data.cotizacion;

      document.getElementById('sec-cotizaciones').style.display = 'none';
      document.getElementById('sec-chat').style.display = 'block';
      document.getElementById('chat-tienda-titulo').innerText = `Chat con ${tiendaNombre}`;

      cargarMensajes();
      intervalChat = setInterval(cargarMensajes, 3000);
    }

    async function cargarMensajes() {
      if (!cotizacionActiva) return;
      const res = await fetch(`${API}/chat/cotizacion/${cotizacionActiva.id}`);
      const msgs = await res.json();
      const box = document.getElementById('chat-box');
      box.innerHTML = '';

      msgs.forEach(m => {
        const div = document.createElement('div');
        div.className = `msg ${m.remitente === 'Cliente' ? 'msg-cliente' : 'msg-tienda'}`;
        div.innerText = `${m.texto}`;
        box.appendChild(div);
      });
      box.scrollTop = box.scrollHeight;
    }

    async function enviarMensaje() {
      const input = document.getElementById('chat-input');
      const texto = input.value.trim();
      if (!texto || !cotizacionActiva) return;

      await fetch(`${API}/chat`, {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ cotizacionId: cotizacionActiva.id, remitente: 'Cliente', texto })
      });
      input.value = '';
      cargarMensajes();
    }

    async function finalizarPedido() {
      const metodo = document.getElementById('select-metodo').value;
      const res = await fetch(`${API}/cotizaciones/${cotizacionActiva.id}/finalizar`, {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ metodoEntrega: metodo })
      });
      if (res.ok) {
        alert('🎉 ¡Pedido enviado a la tienda! Ellos se contactarán a tu WhatsApp para coordinar la entrega.');
        location.reload();
      }
    }
  </script>
</body>
</html>
