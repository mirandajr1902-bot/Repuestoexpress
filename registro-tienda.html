<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Repuestera - RepuestoExpress</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background-color: #f4f6f9; padding: 20px; display: flex; justify-content: center; }
    .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 480px; }
    h2 { color: #1a2a3a; text-align: center; margin-bottom: 20px; }
    label { font-weight: bold; font-size: 14px; color: #444; display: block; margin-top: 12px; margin-bottom: 5px; }
    input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; }
    button { width: 100%; background: #28a745; color: white; border: none; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 8px; margin-top: 20px; cursor: pointer; }
    button:hover { background: #218838; }
    .mensaje { margin-top: 15px; padding: 10px; border-radius: 6px; text-align: center; font-weight: bold; display: none; }
    .exito { background-color: #d4edda; color: #155724; }
    .error { background-color: #f8d7da; color: #721c24; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Registrar Repuestera</h2>
    <form id="formTienda">
      <label>Nombre del Negocio:</label>
      <input type="text" id="nombre" placeholder="Ej: Repuestos El Rey" required>

      <label>Ubicación / Ciudad:</label>
      <input type="text" id="ubicacion" placeholder="Ej: Ciudad de Panamá, Vía España" required>

      <label>Número de WhatsApp (con código de país):</label>
      <input type="tel" id="whatsapp" placeholder="Ej: 50760000000" required>

      <button type="submit">Guardar y Activar Tienda</button>
    </form>

    <div id="mensaje" class="mensaje"></div>
  </div>

  <script>
    const URL_BACKEND = 'https://repuestoexpress.onrender.com';

    document.getElementById('formTienda').addEventListener('submit', async (e) => {
      e.preventDefault();

      const nombre = document.getElementById('nombre').value;
      const ubicacion = document.getElementById('ubicacion').value;
      const whatsapp = document.getElementById('whatsapp').value;
      const mensajeDiv = document.getElementById('mensaje');

      try {
        const res = await fetch(`${URL_BACKEND}/api/tiendas`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nombre, ubicacion, whatsapp })
        });

        if (res.ok) {
          mensajeDiv.className = 'mensaje exito';
          mensajeDiv.textContent = '¡Tienda registrada con éxito!';
          mensajeDiv.style.display = 'block';
          document.getElementById('formTienda').reset();
        } else {
          throw new Error('Error al guardar');
        }
      } catch (err) {
        mensajeDiv.className = 'mensaje error';
        mensajeDiv.textContent = 'Hubo un error al registrar la tienda. Inténtalo de nuevo.';
        mensajeDiv.style.display = 'block';
      }
    });
  </script>
</body>
</html>
